<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - ONG Esperança</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">ONG Esperança</a>

    <button class="menu-toggle" onclick="abrirMenu()">☰</button>

    <nav class="nav-menu" id="navMenu">
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="sobre.html">Sobre nós</a>
        <a href="contato.html">Contato</a>
    </nav>

</header>


<main>

<section class="section">

    <span class="badge">Entre em contato</span>

    <h1>Quer fazer parte?</h1>

    <p>
        Preencha o formulário abaixo para entrar em contato
        com nossa organização.
    </p>


    <form id="formContato" onsubmit="enviarFormulario(event)">

        <label for="nome">Nome</label>
        <input type="text" id="nome" required placeholder="Digite seu nome">

        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="Digite seu e-mail">

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" required placeholder="Digite sua mensagem"></textarea>

        <button type="submit" class="btn">
            Enviar mensagem
        </button>

    </form>

</section>

</main>


<div class="toast" id="toast">
    Mensagem enviada com sucesso!
</div>


<footer>
    <p>© 2026 ONG Esperança</p>
</footer>

<script src="script.js"></script>

</body>
</html>
